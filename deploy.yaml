apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deloyment
  labels:
    app: my-deloyment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-deloyment
  template:
    metadata:
      labels:
        app: my-deloyment
    spec:
      containers:
      - name: my-deloyment
        image: dheerajshekrr/project2
        ports:
        - containerPort: 80
          
