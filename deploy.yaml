apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: my-deployment
spec:
  replicas: 2
  selector:
    app: my-deployment
  template:
    template:
      labels:
        app: my-deployment
    spec:
      containers:
      - name: my-deployment
        image: dheerajshekarr/project2
        ports:
        - conatinerPort: 80
